<!DOCTYPE html>
<html >
<head>
    <title>Register | Henok Brihanu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <link rel="stylesheet" href="registration.css">
</head>
<body>

    <header>
        <nav>
            
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="registration.html" class="active">Register</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="scrollable-content">
        
        <!-- Standalone Profile Photo Below Header -->
        <div class="standalone-profile-wrapper">
            <div class="standalone-profile-container">
                <img src="henich.jpg" alt="Henok Brihanu">
            </div>
           <marquee behavior="" direction="center"><div class="logo"><h2>Henok Brihanu</h2></div></marquee> 
        </div>

        <section class="register-section">
            <div class="register-card">
                <h1>Registration Form</h1>
                <p>Please fill in the details below to join our developer community.</p>
                
                <<form action="https://formspree.io/f/mpqnqaon" method="POST" id="regForm" onsubmit="handleSubmit(event)">
                    <div class="form-group">
                        <label for="username">Full Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="username" placeholder="Enter your full name" required>
                            <i class="fas fa-user"></i>
                        </div>
                    </div>

                    <!-- Added Student ID Field -->
                    <div class="form-group">
                        <label for="studentId">Student ID</label>
                        <div class="input-wrapper">
                            <input type="text" id="studentId" placeholder="WCU174522" required>
                            <i class="fas fa-id-card"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="email" placeholder="example@gmail.com" required>
                            <i class="fas fa-envelope"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="track">Interested Track</label>
                        <div class="input-wrapper">
                            <select id="track" required>
                                <option value="" disabled selected>Select your track</option>
                                <option value="frontend">Frontend Web Development</option>
                                <option value="backend">Backend Web Development</option>
                                <option value="fullstack">Full-Stack Development</option>
                                <option value="uiux">UI/UX Design & Content Creation</option>
                            </select>
                            <i class="fas fa-code"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <div class="input-wrapper">
                            <input type="tel" id="phone" placeholder="Enter your phone number" required>
                            <i class="fas fa-phone-alt"></i>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">Submit Registration</button>
                </form>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 Henok Brihanu | Wachemo University</p>
        </footer>
    </div>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            alert("Thank you for registering! Your data has been received successfully.");
            document.getElementById("regForm").reset();
        }
    </script>
</body>
</html>
