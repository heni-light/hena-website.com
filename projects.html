<!DOCTYPE html>
<html>
<head>
    <title>Registration | Henok Brihanu</title>
    <link rel="stylesheet" href="registration.css">
   
</head>
<body>

    <header>
        <nav>
            <div class="logo">HENOK.B</div>
            
            <div class="profile-container">
                <img src="henich.jpg" alt="Henok Brihanu">
            </div>

            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="registration.html" class="active">Register</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <div class="scrollable-content">
        
        <section class="reg-section">
            <div class="reg-container">
                <h1>Create Account</h1>
                <p>Fill in your details to join the community.</p>
                
                <form id="regForm" action="https://formspree.io/f/mpqnqaon" method="POST">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="fullName" id="fullName" placeholder="Henok Brihanu" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" id="email" placeholder="example@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Gender</label>
                        <select name="gender" id="gender" required>
                            <option value="">Select</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Student ID</label>
                            <input type="text" name="studentId" id="studentId" placeholder="e.g. WCU171256" required>
                        </div>
                        <div class="form-group">
                            <label>Department</label>
                            <input type="text" name="department" id="dept" placeholder="e.g. IT" required>
                        </div>
                    </div>

                    <button type="submit" class="reg-btn">Register Now</button>
                </form>
            </div>
        </section>
        <footer>
            <p>&copy; 2026 Henok Brihanu | Wachemo University</p>
        </footer>
    </div>
    <script>
        document.getElementById('regForm').addEventListener('submit', function(event) {
            const fullName = document.getElementById('fullName').value;
            alert('Welcome ' + fullName + '! Registration data is being submitted.');
        });
    </script>
</body>
</html>
