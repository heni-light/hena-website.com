<!DOCTYPE html>
<html lang="en">
<head>
    <title>Home | Henok Brihanu Portfolio</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            overflow-x: hidden;
        }

        header {
            background: #2c3e50;
            padding: 1rem 0;
            color: white;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #3498db;
        }

        .hero {
            height: 100vh;
            background: linear-gradient(rgba(44, 62, 80, 0.8), rgba(44, 62, 80, 0.8)), 
                        url('https://images.unsplash.com/photo-1517694712202-14dd9538aa97?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            animation: fadeInDown 1s ease;
        }

        .hero p {
            font-size: 1.5rem;
            margin-bottom: 15px;
            max-width: 800px;
            animation: fadeInUp 1s ease;
        }
        .typing-container {
            font-size: 1.6rem;
            font-weight: 600;
            color: #3498db;
            margin-bottom: 30px;
            min-height: 40px;
        }
        .cursor {
            display: inline-block;
            background-color: #3498db;
            margin-left: 4px;
            width: 3px;
            animation: blink 1s infinite;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin-bottom: 30px;
        }

        .stat-item h3 {
            font-size: 2.5rem;
            margin: 0;
            color: #3498db;
        }

        .btn-group {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.4s;
        }

        .btn-main {
            background: #3498db;
            color: white;
        }

        .btn-main:hover {
            background: #2980b9;
            transform: scale(1.05);
        }

        .btn-alt {
            border: 2px solid white;
            color: white;
        }

        .btn-alt:hover {
            background: white;
            color: #2c3e50;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #2c3e50;
            color: white;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .stats { flex-direction: column; gap: 20px; }
            .typing-container { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo"><h2>HB</h2></div>
            <ul>
                <li><a href="index.html">index</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="registration.html">Register</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Henok Brihanu</h1>
        <p>Information Technology Student at Wachemo University</p>
        
        <div class="typing-container">
            I am a <span id="typing-text"></span><span class="cursor">&nbsp;</span>
        </div>

        <div class="stats">
            <div class="stat-item">
                <h3 class="counter" data-target="2">0</h3>
                <span>Year Student</span>
            </div>
        </div>

        <div class="btn-group">
            <a href="projects.html" class="btn btn-main">View Projects</a>
            <a href="contact.html" class="btn btn-alt">Contact Me</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Henok Brihanu. All Rights Reserved.</p>
    </footer>

    <script>
        const words = ["Next Web Developer.", "Tech Innovator.", "Problem Solver."];
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const targetSpan = document.getElementById("typing-text");

        function typeEffect() {
            const currentWord = words[wordIndex];
            
            if (isDeleting) {
                targetSpan.textContent = currentWord.substring(0, charIndex - 1);
                charIndex--;
            } else {
                targetSpan.textContent = currentWord.substring(0, charIndex + 1);
                charIndex++;
            }
            let typingSpeed = isDeleting ? 50 : 100;

            if (!isDeleting && charIndex === currentWord.length) {
                typingSpeed = 2000;
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                wordIndex = (wordIndex + 1) % words.length;
                typingSpeed = 500;
            }

            setTimeout(typeEffect, typingSpeed);
        }
        function runCounterAnimation() {
            const counters = document.querySelectorAll('.counter');
            
            counters.forEach(counter => {
                counter.innerText = '0';
                const target = +counter.getAttribute('data-target');
                if (target <= 10) {
                    counter.innerText = target + "nd";
                } else {
                    const updateCounter = () => {
                        const count = +counter.innerText;
                        const increment = target / 100;
                        if(count < target) {
                            counter.innerText = `${Math.ceil(count + increment)}`;
                            setTimeout(updateCounter, 20);
                        } else {
                            counter.innerText = target;
                        }
                    };
                    updateCounter();
                }
            });
        }
        window.addEventListener('DOMContentLoaded', () => {
            typeEffect();
            runCounterAnimation();
        });
    </script>
</body>
</html>
